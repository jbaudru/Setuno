name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Setuno.exe
        run: pyinstaller build.spec

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Windows installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setuno.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: Setuno-windows-exe
          path: dist/Setuno.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Setuno-windows-installer
          path: dist/installer/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate .icns app icon
        run: bash scripts/make_icns.sh

      - name: Build Setuno.app
        run: pyinstaller build.spec

      - name: Package .dmg installer
        run: hdiutil create -volname "Setuno" -srcfolder dist/Setuno.app -ov -format UDZO dist/Setuno.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Setuno-macos-dmg
          path: dist/Setuno.dmg

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Setuno-windows-exe/Setuno.exe
            artifacts/Setuno-windows-installer/*.exe
            artifacts/Setuno-macos-dmg/Setuno.dmg
